[build-system]
requires = ["setuptools<84.0.0", "setuptools_scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ert"
authors = [{ name = "Equinor ASA", email = "fg_sib-scout@equinor.com" }]
description = "Ensemble based Reservoir Tool (ERT)"
requires-python = ">=3.12, <3.15"
readme = "README.md"
license = "GPL-3.0-only"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Other Environment",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dynamic = ["version"]
dependencies = [
    "aiohttp",
    "anyio",
    "cryptography",
    "decorator",
    "dnspython >= 2",
    "fastapi",
    "fastexcel>=0.14.0", # extra dependency for polars (excel)
    "filelock",
    "graphite-maps >= 0.0.10",
    "httpx",
    "httpx-retries",
    "humanize",
    "iterative-ensemble-smoother>=1.2.0",
    "jinja2 >= 2.10",
    "lark",
    "lxml",
    "matplotlib>=3.11.1",
    "netCDF4",
    "networkx",
    "numpy",
    "opentelemetry-api",
    "opentelemetry-instrumentation-threading",
    "opentelemetry-sdk",
    "orjson",
    "packaging",
    "pandas",
    "pluggy>=1.3.0",
    "polars>=1.36.0",
    "progressbar2",
    "psutil",
    "pyarrow", # extra dependency for pandas (parquet)
    "pydantic > 2",
    "pyqt6 < 6.10.0",  # rhel8 https://www.riverbankcomputing.com/pipermail/pyqt/2025-October/046342.html
    "python-dateutil",
    "python-multipart", # extra dependency for fastapi
    "pyyaml",
    "pyzmq",
    "requests",
    "resfo>=5.0.0",
    "ropt-dakota>=0.28,<0.29",
    "ropt[pandas]>=0.28.1,<0.29",
    "ruamel.yaml",
    "scipy >= 1.10.1",
    "seaborn",
    "surfio>=0.0.11",
    "tables", # extra dependency for pandas (hdf5)
    "tabulate",
    "tqdm>=4.62.0",
    "typing_extensions>=4.5",
    "uvicorn >= 0.17.0",
    "websockets",
    "xarray",
    "xtgeo >= 3.3.0",
    "resfo-utilities>=1.1.0",
    "natsort>=8.4.0",
    "shapely>=2.1.2",
]

[project.scripts]
ert = "ert.__main__:main"
"fm_dispatch.py" = "_ert.forward_model_runner.fm_dispatch:main"
everest = "everest.bin.main:start_everest"
everserver = "everest.detached.everserver:main"

[project.urls]
Repository = "https://github.com/equinor/ert"

[dependency-groups]
dev = [
    "furo",
    "gaussianfft",
    "hypothesis!=6.102.0,!=6.112.3,>=6.85",
    "jsonpath_ng",
    "jupyter",
    "jupytext",
    "nbsphinx",
    "oil_reservoir_synthesizer",
    "pytest-asyncio",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-memray",
    "pytest-mock",
    "pytest-mpl",
    "pytest-qt",
    "pytest-raises",
    "pytest-rerunfailures!=16.0",
    "pytest-snapshot",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-durations",
    "pytest>6",
    "resdata",
    "rust-just",
    "scikit-image",
    "sphinx",
    "sphinx-argparse",
    "sphinx-autobuild",
    "sphinx-autoapi",
    "sphinx-copybutton",
    "sphinxcontrib.datatemplates",
    "json-schema-for-humans",
    "xlsxwriter>=3.2.3",
    "resfo-utilities[testing]>=1.1.0",
]
style = ["pre-commit"]
types = [
    "mypy",
    "types-lxml",
    "types-requests",
    "types-PyYAML",
    "types-python-dateutil",
    "types-decorator",
    "types-docutils",
    "types-tqdm",
    "types-psutil",
    "types-setuptools",
    "types-tabulate",
    "types-networkx",
    "types-shapely",
]

[tool.setuptools]
package-dir = { "" = "src" }
platforms = ["all"]

[tool.setuptools.package-data]
ert = [
    "gui/resources/**/*",
    "resources/**/*",
    "logging/logger.conf",
    "logging/storage_log.conf",
]
everest = ["data/**/*", "*.tmpl", "detached/jobs/everserver"]


[tool.pytest.ini_options]
# --dist loadgroup ensures @pytest.mark.xdist_group markers are honored
# whenever parallelism (-n) is enabled. It is a no-op for serial runs.
addopts = "-ra --strict-markers --dist loadgroup"
norecursedirs = [
    "*.egg",
    ".*",
    "snapshots",
    "baseline",
    "tests/everest/test_data",
    "tests/ert/unit_tests/scheduler/bin",
    "tests/ert/unit_tests/gui/tools/file",
]
markers = [
    "memory_test",
    "creates_tmpdir",
    "snapshot_test",
    "out_of_memory",
    "requires_eclipse",
    "requires_window_manager",
    "screenshot_test",
    "script",
    "slow",
    "unreliable",
    "high_utilization",
    "skip_mac_ci",
    "fuzzing"
]
log_cli = "false"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 360
session_timeout = 2400
timeout_func_only = true # Do not apply timeout to fixtures which can be slow but cached

filterwarnings = [ # Ignore warnings cluttering stdout generated on MacOS due to matplotlib
    "ignore:Matplotlib is currently using agg:UserWarning"
]

[tool.setuptools_scm]
version_file = "src/ert/shared/version.py"
# Fallback needed due to https://github.com/dependabot/dependabot-core/issues/12340
fallback_version = "0.0.0"

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "AIR",
    "missing-return-type-special-method",
    "ASYNC", # flake8-async
    "B",     # flake-8-bugbear
    "C4",    # flake8-comprehensions
    "unnecessary-multiline-docstring",
    "new-line-after-last-paragraph",
    "DJ",
    "DTZ",
    "E",     # pycodestyle
    "EXE",
    "F",     # pyflakes
    "FA",
    "FAST",
    "boolean-default-value-positional-argument",
    "FIX",
    "FLY",
    "FURB",  # refurb
    "G",     # logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "INP",
    "INT",
    "ISC",
    "LOG",   # logging
    "NPY",   # numpy specific rules
    "PD",
    "PERF",
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PLE",
    "PLW",
    "PT",    # pytest
    "os-chmod",
    "os-getcwd",
    "os-path-exists",
    "os-path-isfile",
    "os-path-join",
    "builtin-open",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RSE",   # flake8-raise
    "RUF",   # ruff specific rules
    "SIM",   # flake-8-simplify
    "SLOT",
    "TD",
    "banned-api", # (bare os.chdir in tests)
    "TID",
    "useless-try-except",
    "try-consider-else",
    "UP",    # pyupgrade
    "W",     # pycodestyle
    "YTT"
]
preview = true
ignore = [
    "logging-f-string",
    "eq-without-hash",
    "magic-value-comparison",
    "too-many-statements",
    "too-many-branches",
    "too-many-return-statements",
    "import-private-name",
    "too-many-locals",
    "no-self-use", #
    "eq-without-hash",
    "too-many-public-methods",
    "too-many-nested-blocks",
    "non-empty-init-module",
]

# Allow EN DASH (U+2013)
allowed-confusables = ["–"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = [
    "global-statement",
    "unused-async",
    "assignment-in-assert",
    "asyncio-dangling-task",
    "invalid-envvar-default",
    "used-dummy-variable",
    "implicit-class-var-in-dataclass",
    "blocking-path-method-in-async-function",
]
"src/ert/dark_storage/json_schema/__init__.py" = ["unused-import"]
"src/ert/dark_storage/*" = ["unused-async"]
"src/ert/storage/local_ensemble.py" = ["pandas-use-of-dot-pivot-or-unstack"] # polars .pivot, not pandas
"*.ipynb" = ["module-import-not-at-top-of-file"]
"!tests/**" = ["banned-api"]


[tool.ruff.lint.pylint]
max-args = 20
allow-dunder-method-names = [
    "__default_token__",
    "__get_pydantic_core_schema__",
    "__get_pydantic_json_schema__",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.chdir".msg = "Use monkeypatch.chdir or the use_tmpdir fixture so the working directory is restored on teardown."

[tool.pyright]
include = ["src"]
exclude = ["tests"]
reportMissingImports = "error"
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pyright.defineConstant]
PYSIDE6 = false
PYQT5 = false
PYSIDE2 = false
PYQT6 = true

[tool.uv]
fork-strategy = "requires-python"
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
carolina = false  # Developed by Equinor
iterative_ensemble_smoother = false # Developed by Equinor
graphite-maps = false # Developed by Equinor
oil_reservoir_synthesizer = false # Developed by Equinor
pyarrow = false # needed until 19.08.2026
resdata = false # Developed by Equinor
resfo = false # Developed by Equinor
resfo-utilities = false # Developed by Equinor
ropt = false # Developed in cooperation with Equinor
ropt-dakota = false # Developed in cooperation with Equinor
xtgeo = false # Developed by Equinor
