name: install_flow
description: Installs OPM flow from the OPM PPA and verifies where it came from

runs:
  using: "composite"
  steps:
    - name: Install flow from the OPM PPA
      run: |
        set -e
        sudo apt-get install -y software-properties-common
        sudo apt-add-repository -y ppa:opm/ppa
        sudo apt-get update
        sudo apt-get install -y mpi-default-bin
        sudo apt-get install -y libopm-simulators-bin python3-opm-common
      shell: bash

    - name: Verify flow origin and version
      run: |
        set -e
        POLICY=$(apt-cache policy libopm-simulators-bin)
        echo "$POLICY"
        if ! echo "$POLICY" | grep -A3 '\*\*\*' | grep -q 'ppa.launchpadcontent.net/opm/ppa'; then
          echo "::error::libopm-simulators-bin was not installed from ppa:opm/ppa"
          exit 1
        fi
        which flow
        flow --version
        {
          echo "### OPM flow"
          echo '```'
          echo "$POLICY"
          flow --version
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash
