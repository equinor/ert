name: Check for fixup commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-fixup-commits:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: tree:0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fail if PR contains fixup!, squash! or amend! commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          offending=$(git log --format='%h %s' "$BASE_SHA..$HEAD_SHA" | grep -E '^[0-9a-f]+ (fixup|squash|amend)! ' || true)
          if [ -n "$offending" ]; then
            echo "::error::Found commits that must be autosquashed before merging:"
            echo "$offending"
            echo "Run: git rebase -i --autosquash origin/main && git push --force-with-lease"
            exit 1
          fi
          echo "No fixup commits found."
