name: Run test-data

on:
 push:
   branches:
     - main
     - 'version-**'
 workflow_call:
 workflow_dispatch:

permissions:
   contents: read

env:
  ERT_SHOW_BACKTRACE: 1
  UV_FROZEN: true
  OMP_NUM_THREADS: 1

jobs:
  run-ert-test-data:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        filter: tree:0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        prune-cache: false
        python-version: ${{ matrix.python-version }}

    - name: Install ERT and dependencies
      run: |
        uv sync

    - name: Test poly example
      run: |
        pushd test-data/ert/poly_example
        uv run ert test_run poly.ert
        popd

    - name: Test snake_oil
      run: |
        pushd test-data/ert/snake_oil
        uv pip install oil_reservoir_synthesizer resdata
        uv run ert test_run snake_oil.ert
        popd

    - name: Test snake_oil_field
      run: |
        pushd test-data/ert/snake_oil
        uv run ert test_run snake_oil.ert
        popd

    - name: Test waterflood
      run: |
        pushd test-data/ert/waterflood
        uv run ert test_run config.ert
        popd
