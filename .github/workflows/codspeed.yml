name: CodSpeed

on:
  push:
    branches:
      - "main"
  workflow_dispatch:
  workflow_call:

permissions:
   contents: read

env:
  UV_FROZEN: true
  OMP_NUM_THREADS: 1

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/install_dependencies_qt
        with:
          os: ubuntu-latest
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: false
          python-version: '3.14'
      - run: |
          uv sync --group dev
          uv pip uninstall pytest-benchmark
          uv pip install pytest-codspeed
      - uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: |
            uv run pytest tests/ert/performance_tests --codspeed --timeout=1200 -m "not memory_test"
