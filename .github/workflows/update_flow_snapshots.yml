name: Update flow reference snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: true

jobs:
  update-flow-snapshots:
    name: Regenerate snapshots using OPM flow
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
        submodules: true
        lfs: true

    - uses: ./.github/actions/install_dependencies_qt
      with:
        os: ubuntu-latest

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        prune-cache: false
        python-version: '3.14'

    - name: Install ert and everest
      run: uv sync --group dev

    - name: Install flow
      uses: ./.github/actions/install_flow

    - name: Update RFT pressure snapshot
      run: |
        # pytest-snapshot exits non-zero whenever it rewrites a snapshot
        uv run pytest tests/ert/ui_tests/cli/test_update_with_rft_observations.py \
          --snapshot-update || true

    - name: Verify regenerated snapshot
      run: |
        uv run pytest tests/ert/ui_tests/cli/test_update_with_rft_observations.py

    - name: Summarize snapshot changes
      run: |
        {
          echo "### Flow version"
          echo '```'
          flow --version
          echo '```'
          echo "### Snapshot diff"
          echo '```diff'
          git diff -- tests/ert/ui_tests/cli/snapshots/test_update_with_rft_observations
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        git diff --quiet -- tests/ert/ui_tests/cli/snapshots/test_update_with_rft_observations \
          || echo "Snapshot changed"

    - name: Upload updated snapshots
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: updated-flow-snapshots
        path: tests/ert/ui_tests/cli/snapshots/test_update_with_rft_observations/
        if-no-files-found: error
        retention-days: 3
