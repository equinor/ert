on:
  workflow_call:
    inputs:
      os:
        type: string
      python-version:
        type: string

permissions:
   contents: read

env:
  UV_FROZEN: true

jobs:
  test-ert-with-flow:
    name: Run ert tests
    timeout-minutes: 20
    runs-on: ${{ inputs.os }}

    steps:
    - name: Check /etc/hosts
      run: |
        echo "/etc/hosts ::"
        cat /etc/hosts
        if grep -q '^-' /etc/hosts; then
          echo "Found corrupted /etc/hosts - attempting fix"
          sudo sed -i s'/^-[^ ] //' /etc/hosts
          echo "/etc/hosts ::"
          cat /etc/hosts
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/install_dependencies_qt
      with:
        os: ${{ inputs.os }}

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: setup_python
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        prune-cache: false
        python-version: ${{ inputs.python-version }}

    - name: Install ert and everest
      run: |
        uv sync --group dev
        uv pip install git+https://github.com/equinor/everest-models

    - name: Install flow
      uses: ./.github/actions/install_flow

    - name: Run integration tests towards OPM flow without flowrun
      run: |
        set -e
        uv run pytest tests/ert/unit_tests/resources/test_run_flow_simulator.py

    - name: Run Ert on an example configuration with flow
      run: |
        pushd test-data/ert/flow_example
        perl -p -i -e 's/NUM_REALIZATIONS\s*12/NUM_REALIZATIONS 2/g' flow.ert
        uv run ert ensemble_experiment --disable-monitoring flow.ert
        popd

    - name: Run update with rft observations
      run: |
        set -e
        uv run pytest tests/ert/ui_tests/cli/test_update_with_rft_observations.py

    - name: Run EVEREST on an example configuration with flow
      run: |
        pushd test-data/everest/eightcells/everest/model
        yq eval '.model.realizations = [0, 1]' -i config.yml
        yq eval '.simulator.queue_system.max_running = 4' -i config.yml
        uv run everest lint config.yml
        uv run everest run config.yml --disable-monitoring
        popd
